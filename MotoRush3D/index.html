<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moto Rush 3D PRO</title>
    <!-- Use a premium font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <!-- 3D Canvas Container -->
    <div id="game-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <!-- Main Menu -->
        <div id="menu-screen" class="screen glass-panel active">
            <h1 class="glow-text">MOTO RUSH</h1>
            <h2 class="sub-text">3D EDITION</h2>
            <button id="start-btn" class="cyber-button" onclick="if(typeof startGame === 'function') startGame();">START ENGINE</button>
            <div class="controls">
                <p><strong>A / D</strong> or <strong>Arrows</strong> to Steer</p>
                <p><strong>W</strong> to Accelerate</p>
                <p>Avoid cars and collect giant coins!</p>
            </div>
            
            <div class="settings-panel">
                <button id="toggle-env-btn" class="cyber-button small-btn" onclick="if(typeof toggleEnvironment === 'function') toggleEnvironment();">NIGHT MODE</button>
                <button id="toggle-diff-btn" class="cyber-button small-btn" onclick="if(typeof toggleDifficulty === 'function') toggleDifficulty();">NORMAL MODE</button>
                <button id="open-garage-btn" class="cyber-button small-btn" onclick="if(typeof openGarage === 'function') openGarage();">GARAGE</button>
            </div>
        </div>

        <!-- Garage Screen -->
        <div id="garage-screen" class="screen glass-panel hidden">
            <h1 class="glow-text">GARAGE</h1>
            <h2 class="sub-text">COINS: <span id="garage-coins" class="text-gold">0</span></h2>
            
            <div class="garage-items" style="display: flex; gap: 20px; margin-bottom: 30px;">
                <div class="garage-item glass-panel" style="padding: 20px; text-align: center;">
                    <h3>Basic Bike</h3>
                    <p>Owned</p>
                    <button id="btn-basic-bike" class="cyber-button small-btn" onclick="buyOrSelectVehicle('basic-bike', 0)">EQUIPPED</button>
                </div>
                <div class="garage-item glass-panel" style="padding: 20px; text-align: center;">
                    <h3>Sport Bike</h3>
                    <p>Cost: <span class="text-gold">500</span></p>
                    <button id="btn-sport-bike" class="cyber-button small-btn" onclick="buyOrSelectVehicle('sport-bike', 500)">BUY</button>
                </div>
                <div class="garage-item glass-panel" style="padding: 20px; text-align: center;">
                    <h3>Muscle Car</h3>
                    <p>Cost: <span class="text-gold">1000</span></p>
                    <button id="btn-muscle-car" class="cyber-button small-btn" onclick="buyOrSelectVehicle('muscle-car', 1000)">BUY</button>
                </div>
            </div>
            
            <button id="close-garage-btn" class="cyber-button" onclick="if(typeof closeGarage === 'function') closeGarage();">BACK TO MENU</button>
        </div>

        <!-- HUD (Hidden on start) -->
        <div id="hud-screen" class="screen hidden" style="pointer-events: none;">
            <div class="hud-top">
                <div class="hud-box score-box glass-panel" style="pointer-events: auto;">
                    <span class="label">SCORE</span>
                    <span id="score-val" class="value">0</span>
                </div>
                <div class="hud-controls" style="display: flex; gap: 15px; align-items: center; pointer-events: auto;">
                    <button id="pause-btn" class="cyber-button small-btn" onclick="if(typeof togglePause === 'function') togglePause();" style="margin-bottom: 0; padding: 10px 20px;">PAUSE</button>
                    <button id="home-btn" class="cyber-button small-btn" onclick="if(typeof returnToMenu === 'function') returnToMenu();" style="margin-bottom: 0; padding: 10px 20px;">HOME</button>
                </div>
                <div class="hud-box coin-box glass-panel" style="pointer-events: auto;">
                    <span class="label">COINS</span>
                    <span id="coin-val" class="value text-gold">0</span>
                </div>
            </div>
            <div class="hud-bottom">
                <div class="speed-dial glass-panel">
                    <span id="speed-val">0</span>
                    <span class="unit">KM/H</span>
                </div>
            </div>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="screen glass-panel hidden">
            <h1 class="glow-text text-gold">PAUSED</h1>
            <div style="height: 40px;"></div>
            <button id="resume-btn" class="cyber-button" onclick="if(typeof togglePause === 'function') togglePause();">RESUME</button>
            <button id="pause-home-btn" class="cyber-button" onclick="if(typeof returnToMenu === 'function') returnToMenu();">MAIN MENU</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen glass-panel hidden">
            <h1 class="glow-text text-red">CRASHED!</h1>
            <div class="stats">
                <p>Final Score: <span id="final-score" class="text-gold">0</span></p>
                <p>Coins Collected: <span id="final-coins" class="text-gold">0</span></p>
            </div>
            <button id="restart-btn" class="cyber-button" onclick="if(typeof startGame === 'function') startGame();">RIDE AGAIN</button>
        </div>
    </div>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js?v=7"></script>
</body>
</html>
